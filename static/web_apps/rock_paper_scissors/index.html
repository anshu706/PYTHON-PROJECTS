<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS Arena — Premium Game</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient visual backdrops -->
  <div class="visual-blob blob-gold" aria-hidden="true"></div>
  <div class="visual-blob blob-rose" aria-hidden="true"></div>
  <div class="grid-line-layer" aria-hidden="true"></div>

  <main class="wrapper">
    <div class="panel">

      <!-- Header bar -->
      <div class="panel-header">
        <span class="logo-mark">⚡ RPS_ARENA</span>
        <div class="streak-badge">
          <span>STREAK:</span>
          <span id="streak-val">0</span>
        </div>
      </div>

      <h1>RPS Arena</h1>

      <!-- Scoreboard widget -->
      <div class="scoreboard">
        <div class="score-card">
          <span class="score-label">Player</span>
          <span class="score-num" id="player-score">0</span>
        </div>
        <div class="divider-line">VS</div>
        <div class="score-card">
          <span class="score-label">CPU</span>
          <span class="score-num" id="computer-score">0</span>
        </div>
      </div>

      <!-- Live matchup display -->
      <div class="matchup-view">
        <div class="match-slot player-slot">
          <div class="gesture-icon" id="player-gesture">❔</div>
          <span class="slot-label">You</span>
        </div>
        <div class="vs-glow">VS</div>
        <div class="match-slot cpu-slot">
          <div class="gesture-icon" id="computer-gesture">❔</div>
          <span class="slot-label">CPU</span>
        </div>
      </div>

      <!-- Game Status feedback -->
      <div class="status-box">
        <div class="status-msg" id="status">MAKE YOUR MOVE</div>
      </div>

      <!-- Actions/Choices -->
      <div class="choices-container">
        <button class="choice-btn choice-rock" data-choice="rock" title="Choose Rock">
          <span class="choice-emoji">✊</span>
          <span class="choice-label">Rock</span>
        </button>
        <button class="choice-btn choice-paper" data-choice="paper" title="Choose Paper">
          <span class="choice-emoji">✋</span>
          <span class="choice-label">Paper</span>
        </button>
        <button class="choice-btn choice-scissors" data-choice="scissors" title="Choose Scissors">
          <span class="choice-emoji">✌️</span>
          <span class="choice-label">Scissors</span>
        </button>
      </div>

      <!-- Reset -->
      <div class="footer-actions">
        <button id="reset-btn" class="btn-reset">Reset Scoreboard</button>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
