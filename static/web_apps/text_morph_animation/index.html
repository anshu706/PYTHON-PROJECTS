<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Morph Animation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { background-color: #030305; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .glass { background: rgba(14, 14, 22, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .morph-text { transition: all 0.5s ease-in-out; }
  </style>
</head>
<body x-data="textMorphApp()" x-init="startMorph()">
  <div class="glass rounded-3xl p-12 shadow-2xl text-center space-y-6 max-w-lg w-full">
    <h1 class="text-xs font-mono uppercase tracking-widest text-slate-500">DYNAMIC TEXT MORPH</h1>
    
    <div class="h-24 flex items-center justify-center">
      <span class="text-4xl sm:text-5xl font-black uppercase tracking-tight bg-gradient-to-r from-violet-400 via-pink-400 to-amber-300 bg-clip-text text-transparent morph-text"
            :class="fade ? 'opacity-0 scale-90 blur-sm' : 'opacity-100 scale-100 blur-0'"
            x-text="words[currentIdx]">
      </span>
    </div>

    <p class="text-xs text-slate-400">Morphing through Python, Web & Animation topics</p>
  </div>

  <script>
    function textMorphApp() {
      return {
        words: ['PYTHON', 'SINTER', 'FUTURE', 'CYBER', 'HYPER', 'KINETIC', 'ANIMATION'],
        currentIdx: 0, fade: false,
        startMorph() {
          setInterval(() => {
            this.fade = true;
            setTimeout(() => {
              this.currentIdx = (this.currentIdx + 1) % this.words.length;
              this.fade = false;
            }, 500);
          }, 2000);
        }
      }
    }
  </script>
</body>
</html>
