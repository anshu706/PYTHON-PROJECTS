<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat Expense Splitter — Rent & Bill Calculator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brandBase: '#090f1c', cardBg: '#10192f' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #090f1c; color: #f8fafc; font-family: system-ui, sans-serif; min-height: 100vh; }
    .glass { background: rgba(16, 25, 47, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-input { background: rgba(8, 21, 46, 0.8); border: 1px solid rgba(0, 200, 150, 0.2); transition: all 0.2s; color: #fff; }
    .glow-input:focus { border-color: #00c896; outline: none; box-shadow: 0 0 15px rgba(0, 200, 150, 0.25); }
    .btn-emerald { background: linear-gradient(135deg, #00c896 0%, #00a876 100%); transition: all 0.3s; color: #090f1c; font-weight: 700; }
    .btn-emerald:hover { box-shadow: 0 0 20px rgba(0, 200, 150, 0.4); transform: translateY(-1px); }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen relative" x-data="rentApp()">

  <!-- Ambient Glow -->
  <div class="fixed top-[-10%] left-[20%] w-[500px] h-[500px] rounded-full bg-emerald-600/10 blur-[130px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[10%] w-[500px] h-[500px] rounded-full bg-amber-600/10 blur-[130px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-4xl mx-auto glass rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-white/10 pb-6 mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-black tracking-tight bg-gradient-to-r from-emerald-400 to-amber-300 bg-clip-text text-transparent flex items-center gap-3">
          <span>💰</span> FLAT EXPENSE SPLITTER
        </h1>
        <p class="text-slate-400 text-sm mt-1">Fair, real-time shared living cost calculator</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-mono px-3 py-1.5 rounded-full border border-emerald-500/30 text-emerald-300 bg-emerald-500/10">
          AUTOMATED BREAKDOWN
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Column: Input Form -->
      <div class="lg:col-span-7 space-y-6">
        
        <div class="bg-slate-900/80 border border-white/10 rounded-2xl p-6 space-y-4">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-white/10 pb-3">Monthly Expenses & Occupancy</h3>

          <div>
            <label class="block text-xs text-slate-400 mb-1">🏠 Monthly House Rent (Rs)</label>
            <input type="number" x-model.number="rent" class="glow-input w-full px-4 py-2.5 rounded-xl text-sm font-mono" placeholder="15000">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">🥗 Food & Groceries Expense (Rs)</label>
            <input type="number" x-model.number="food" class="glow-input w-full px-4 py-2.5 rounded-xl text-sm font-mono" placeholder="6000">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">⚡ Electricity Units</label>
              <input type="number" x-model.number="elecUnits" class="glow-input w-full px-4 py-2.5 rounded-xl text-sm font-mono" placeholder="150">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">💸 Charge / Unit (Rs)</label>
              <input type="number" x-model.number="chargePerUnit" class="glow-input w-full px-4 py-2.5 rounded-xl text-sm font-mono" placeholder="10">
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">👥 Total Roommates / Persons</label>
            <input type="number" min="1" x-model.number="persons" class="glow-input w-full px-4 py-2.5 rounded-xl text-sm font-mono text-center font-bold text-emerald-400">
          </div>
        </div>

      </div>

      <!-- Right Column: Results & Breakdown -->
      <div class="lg:col-span-5 flex flex-col justify-between space-y-6">
        
        <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-6 space-y-4">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-white/10 pb-3">
            Per-Person Calculation
          </h3>

          <div class="space-y-3">
            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl">
              <span class="text-xs text-slate-400">Electricity Total:</span>
              <span class="font-mono text-amber-300 font-bold" x-text="'Rs ' + elecTotal.toFixed(2)"></span>
            </div>

            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl">
              <span class="text-xs text-slate-400">Grand Total Bill:</span>
              <span class="font-mono text-white font-bold text-base" x-text="'Rs ' + grandTotal.toFixed(2)"></span>
            </div>

            <!-- Big Highlighted Per-Person Cost -->
            <div class="bg-gradient-to-br from-emerald-950/60 to-teal-950/60 border border-emerald-500/30 p-5 rounded-2xl text-center shadow-lg">
              <span class="text-xs font-mono uppercase tracking-widest text-emerald-300">EACH PERSON PAYS</span>
              <div class="text-4xl font-black text-emerald-400 font-mono my-2" x-text="perPersonCost > 0 && isFinite(perPersonCost) ? 'Rs ' + perPersonCost.toFixed(2) : 'Rs 0.00'"></div>
              <span class="text-[0.65rem] text-slate-400" x-text="'Split across ' + (persons || 1) + ' flatmates'"></span>
            </div>
          </div>

          <div class="pt-2">
            <button @click="copySummary" class="btn-emerald w-full py-3 rounded-xl text-sm font-bold">
              📋 Copy Summary text
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    function rentApp() {
      return {
        rent: 15000,
        food: 6000,
        elecUnits: 150,
        chargePerUnit: 10,
        persons: 3,

        get elecTotal() {
          return (this.elecUnits || 0) * (this.chargePerUnit || 0);
        },

        get grandTotal() {
          return (this.rent || 0) + (this.food || 0) + this.elecTotal;
        },

        get perPersonCost() {
          const p = this.persons || 1;
          return this.grandTotal / p;
        },

        copySummary() {
          const text = `💰 FLAT EXPENSE BREAKDOWN\nRent: Rs ${this.rent}\nFood: Rs ${this.food}\nElectricity: Rs ${this.elecTotal}\n-------------------\nTotal Bill: Rs ${this.grandTotal}\nPer Person (${this.persons} people): Rs ${this.perPersonCost.toFixed(2)}`;
          navigator.clipboard.writeText(text);
          alert("✅ Expense summary copied to clipboard!");
        }
      }
    }
  </script>
</body>
</html>
