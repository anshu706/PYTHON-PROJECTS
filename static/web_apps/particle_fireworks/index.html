<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Fireworks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030305; color: #fff; margin: 0; overflow: hidden; cursor: pointer; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: none; text-align: center; }
  </style>
</head>
<body>
  <div class="overlay">
    <h1 class="text-2xl font-black uppercase tracking-tight bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
      🎆 Particle Fireworks
    </h1>
    <p class="text-xs text-slate-400">Click anywhere on the screen to launch fireworks!</p>
  </div>
  <canvas id="fwCanvas"></canvas>

  <script>
    const canvas = document.getElementById("fwCanvas");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize); resize();

    let particles = [];
    class Particle {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = Math.random() * 3 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.hue = Math.random() * 360;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.05; // gravity
        this.alpha -= this.decay;
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
        ctx.shadowBlur = 10; ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y));
      }
    }

    window.addEventListener("click", (e) => createExplosion(e.clientX, e.clientY));

    (function loop() {
      ctx.fillStyle = "rgba(3, 3, 5, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.update(); p.draw();
        if (p.alpha <= 0) particles.splice(idx, 1);
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
