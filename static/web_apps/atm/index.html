<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anteiku ATM — Neon Banking</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brandBase: '#090f1c', panelBg: '#10192f' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #090f1c; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    .glass { background: rgba(16, 25, 47, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-input { background: rgba(8, 21, 46, 0.8); border: 1px solid rgba(124, 247, 255, 0.2); transition: all 0.2s; color: #9cf9ff; }
    .glow-input:focus { border-color: #7cf7ff; outline: none; box-shadow: 0 0 15px rgba(124, 247, 255, 0.25); }
    .btn-neon { background: linear-gradient(135deg, #2ec8ff 0%, #00d084 100%); transition: all 0.3s; color: #04101d; font-weight: 700; }
    .btn-neon:hover { box-shadow: 0 0 20px rgba(46, 200, 255, 0.4); transform: translateY(-1px); }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen relative overflow-x-hidden" x-data="atmApp()">

  <!-- Ambient Glow -->
  <div class="fixed top-[-10%] left-[20%] w-[500px] h-[500px] rounded-full bg-cyan-600/10 blur-[130px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[10%] w-[500px] h-[500px] rounded-full bg-blue-600/10 blur-[130px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-4xl mx-auto glass rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-white/10 pb-6 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-teal-300 bg-clip-text text-transparent flex items-center gap-3">
          <span>🏧</span> ANTEIKU ATM v3
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm font-mono mt-1">Aesthetic Neon Banking Interface</p>
      </div>
      <div class="text-right">
        <span class="text-xs font-mono uppercase px-3 py-1.5 rounded-full border border-cyan-500/30 text-cyan-300 bg-cyan-500/10">
          SECURE TERMINAL
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Panel: Card Selection & Verification -->
      <div class="lg:col-span-7 space-y-6">
        
        <div>
          <h2 class="text-lg font-bold text-slate-200 mb-1">Select Card Profile</h2>
          <p class="text-xs text-slate-400 mb-4">Click a profile to insert card into the ATM</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <template x-for="acc in accounts" :key="acc.card_code">
              <div @click="selectAccount(acc)" 
                   class="p-4 rounded-2xl border cursor-pointer transition-all duration-200 relative overflow-hidden"
                   :class="selectedAccount && selectedAccount.card_code === acc.card_code 
                           ? 'bg-cyan-950/40 border-cyan-400 shadow-[0_0_20px_rgba(46,200,255,0.2)] scale-[1.02]' 
                           : 'bg-slate-900/60 border-white/5 hover:border-white/20 hover:bg-slate-900/80'">
                <div class="flex justify-between items-start mb-2">
                  <span class="font-bold text-white text-base" x-text="acc.name"></span>
                  <span class="text-[0.65rem] font-mono uppercase px-2 py-0.5 rounded bg-white/10 text-cyan-300" x-text="'CODE: ' + acc.card_code.toUpperCase()"></span>
                </div>
                <p class="text-xs text-slate-400 font-mono" x-text="acc.title"></p>
                <div class="mt-3 text-right">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-lg"
                        :class="selectedAccount && selectedAccount.card_code === acc.card_code ? 'bg-cyan-400 text-slate-950' : 'bg-white/5 text-slate-300'">
                    <span x-text="selectedAccount && selectedAccount.card_code === acc.card_code ? 'Inserted ✓' : 'Insert Card'"></span>
                  </span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- PIN Verification Block -->
        <div class="bg-slate-900/70 border border-white/10 rounded-2xl p-5">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">PIN Verification</h3>
          <p class="text-xs text-slate-400 mb-4 font-mono" x-text="pinHint"></p>

          <div class="flex items-center gap-3">
            <input type="password" maxlength="4" x-model="pinInput" placeholder="4-digit PIN"
                   :disabled="!selectedAccount || sessionUnlocked"
                   class="glow-input font-mono text-xl tracking-widest text-center px-4 py-2.5 rounded-xl w-40 disabled:opacity-40"
                   @keyup.enter="verifyPin" />
            <button @click="verifyPin" :disabled="!selectedAccount || sessionUnlocked"
                    class="btn-neon px-6 py-3 rounded-xl font-bold text-sm tracking-wide disabled:opacity-40 disabled:pointer-events-none">
              UNLOCK
            </button>
          </div>
        </div>

      </div>

      <!-- Right Panel: Session Actions & Live Receipt -->
      <div class="lg:col-span-5 flex flex-col justify-between space-y-6">
        
        <!-- Actions Card -->
        <div class="bg-slate-900/70 border border-white/10 rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-white/5 pb-3">
            <span class="text-xs font-mono uppercase text-slate-400">Active Profile</span>
            <span class="text-sm font-bold text-cyan-300" x-text="selectedAccount ? selectedAccount.name : 'No card inserted'"></span>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-2">Withdraw Amount ($)</label>
            <input type="number" x-model.number="withdrawAmount" placeholder="Enter amount..."
                   :disabled="!sessionUnlocked"
                   class="w-full glow-input font-mono text-base px-4 py-2.5 rounded-xl disabled:opacity-40" />
          </div>

          <div class="grid grid-cols-2 gap-3 pt-1">
            <button @click="checkBalance" :disabled="!sessionUnlocked"
                    class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs tracking-wide transition-all disabled:opacity-40">
              CHECK BALANCE
            </button>
            <button @click="withdrawCash" :disabled="!sessionUnlocked"
                    class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2.5 rounded-xl text-xs tracking-wide transition-all disabled:opacity-40">
              WITHDRAW CASH
            </button>
          </div>
        </div>

        <!-- Receipt Console -->
        <div class="bg-slate-950/80 border border-cyan-500/20 rounded-2xl p-5 flex-1 flex flex-col justify-between font-mono text-xs text-teal-300 shadow-inner">
          <div>
            <div class="flex items-center justify-between border-b border-teal-500/20 pb-2 mb-3 text-slate-400">
              <span>TERMINAL STATUS</span>
              <span x-text="statusText"></span>
            </div>
            <pre class="whitespace-pre-wrap leading-relaxed font-mono text-[0.8rem]" x-text="receiptLines.join('\n')"></pre>
          </div>
          <div class="pt-4 border-t border-teal-500/20 text-right text-[0.7rem] text-slate-500">
            ANTEIKU BANKING OS • VER 3.0
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    function atmApp() {
      return {
        accounts: [
          { card_code: 'k', name: 'Ken Kaneki', title: 'Midnight Account', pin: 1234, balance: 50000 },
          { card_code: 's', name: 'Sasuke Uchiha', title: 'Storm Account', pin: 5678, balance: 100000 },
          { card_code: 'i', name: 'Itachi Uchiha', title: 'Shadow Account', pin: 9123, balance: 60000 },
          { card_code: 'l', name: 'Light Yagami', title: 'Nova Account', pin: 8123, balance: 40000 },
        ],
        selectedAccount: null,
        pinInput: '',
        pinAttempts: 0,
        sessionUnlocked: false,
        withdrawAmount: '',
        pinHint: 'Select an account card to begin.',
        statusText: 'IDLE',
        receiptLines: [
          '---- ANTEIKU ATM ----',
          'STATUS    : Terminal Ready',
          '',
          'Insert a profile card to initiate session.'
        ],

        selectAccount(account) {
          this.selectedAccount = account;
          this.pinInput = '';
          this.withdrawAmount = '';
          this.pinAttempts = 0;
          this.sessionUnlocked = false;
          this.pinHint = `Enter 4-digit PIN for ${account.name}`;
          this.statusText = 'CARD INSERTED';

          this.receiptLines = [
            '---- ANTEIKU ATM ----',
            `USER      : ${account.name}`,
            `PROFILE   : ${account.title}`,
            'STATUS    : Card Inserted',
            '',
            'Authenticate with 4-digit PIN.'
          ];
        },

        verifyPin() {
          if (!this.selectedAccount) return;
          if (this.pinInput.length !== 4 || isNaN(this.pinInput)) {
            this.pinHint = 'PIN must be exactly 4 numeric digits!';
            return;
          }

          if (parseInt(this.pinInput) === this.selectedAccount.pin) {
            this.sessionUnlocked = true;
            this.pinHint = 'Session Unlocked ✓';
            this.statusText = 'SESSION AUTHENTICATED';
            this.receiptLines = [
              '---- ACCESS GRANTED ----',
              `USER      : ${this.selectedAccount.name}`,
              'STATUS    : Session Unlocked',
              '',
              'Select an action: Check Balance or Withdraw Cash.'
            ];
          } else {
            this.pinAttempts++;
            const remaining = 3 - this.pinAttempts;
            this.pinInput = '';

            if (remaining <= 0) {
              this.selectedAccount = null;
              this.sessionUnlocked = false;
              this.pinHint = 'Session Blocked x3. Select profile again.';
              this.statusText = 'BLOCKED';
              this.receiptLines = [
                '---- SECURITY ALERT ----',
                'AUTH FAILED',
                'Reason: 3 Invalid PIN attempts',
                'Action: Session Terminated'
              ];
            } else {
              this.pinHint = `PIN incorrect! Attempts remaining: ${remaining}`;
            }
          }
        },

        checkBalance() {
          if (!this.selectedAccount || !this.sessionUnlocked) return;
          this.receiptLines = [
            '---- BALANCE ENQUIRY ----',
            `USER      : ${this.selectedAccount.name}`,
            `ACCOUNT   : ${this.selectedAccount.title}`,
            `BALANCE   : $${this.selectedAccount.balance.toLocaleString()}`,
            '',
            'Thank you for banking with ANTEIKU.'
          ];
        },

        withdrawCash() {
          if (!this.selectedAccount || !this.sessionUnlocked) return;
          const amt = parseInt(this.withdrawAmount);
          if (isNaN(amt) || amt <= 0) {
            this.pinHint = 'Enter a valid positive amount.';
            return;
          }
          if (amt > this.selectedAccount.balance) {
            this.receiptLines = [
              '---- TRANSACTION FAILED ----',
              `USER      : ${this.selectedAccount.name}`,
              `REQUESTED : $${amt.toLocaleString()}`,
              'REASON    : Insufficient Funds'
            ];
            return;
          }

          this.selectedAccount.balance -= amt;
          const remaining = this.selectedAccount.balance;
          this.withdrawAmount = '';

          this.receiptLines = [
            '---- TRANSACTION RECEIPT ----',
            `USER      : ${this.selectedAccount.name}`,
            `WITHDRAWN : $${amt.toLocaleString()}`,
            `REMAINING : $${remaining.toLocaleString()}`,
            '',
            'Please collect your cash safely.'
          ];
        }
      }
    }
  </script>
</body>
</html>
