<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Casino</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brandBase: '#030305' }
        }
      }
    };
  </script>
  <style>
    body { background-color: #030305; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .glass { background: rgba(12,12,18,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
    .glow-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
    .glow-input:focus { border-color: #a78bfa; outline: none; box-shadow: 0 0 15px rgba(167,139,250,0.2); }
    .neon-btn { background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%); transition: all 0.3s; }
    .neon-btn:hover { box-shadow: 0 0 25px rgba(167,139,250,0.5); transform: translateY(-2px); }
    .neon-btn:active { transform: translateY(0); }
    
    /* Custom Radio Buttons */
    .num-btn input:checked + div { background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%); border-color: transparent; }
  </style>
</head>
<body x-data="casinoGame()">

  <!-- Ambient Orbs -->
  <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-violet-600/10 blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-cyan-600/10 blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-lg mx-auto p-6">
    
    <div class="text-center mb-8">
      <h1 class="text-4xl font-black tracking-tight mb-2 uppercase" style="background: linear-gradient(to right, #a78bfa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        🎰 Lucky Casino
      </h1>
      <p class="text-slate-400 font-medium tracking-wide text-sm">WIN 10X YOUR BET</p>
    </div>

    <div class="glass rounded-3xl p-8 shadow-2xl">
      
      <!-- LOGIN SCREEN -->
      <template x-if="!gameStarted">
        <div class="space-y-6 animate-[fadeIn_0.3s_ease-out]">
          
          <div class="bg-white/5 rounded-2xl p-4 border border-white/10 mb-6 text-sm text-slate-300">
            <p class="font-bold text-white mb-2">📋 RULES:</p>
            <ul class="list-disc pl-5 space-y-1">
              <li>Guess a number from 1 to 10</li>
              <li>Correct guess wins 10x your bet</li>
              <li>Wrong guess loses your bet</li>
              <li>Play until balance reaches $0</li>
            </ul>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">👤 Player Name</label>
            <input type="text" x-model="playerName" class="w-full glow-input rounded-xl px-4 py-3 text-white placeholder-slate-600 font-medium" placeholder="Enter your name...">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">💰 Deposit Amount ($)</label>
            <input type="number" x-model.number="balance" class="w-full glow-input rounded-xl px-4 py-3 text-white placeholder-slate-600 font-medium font-mono" placeholder="100">
          </div>

          <button @click="startGame" class="w-full neon-btn rounded-xl py-3.5 mt-4 font-bold tracking-wide text-white shadow-lg">
            🚀 START PLAYING
          </button>
        </div>
      </template>

      <!-- GAME SCREEN -->
      <template x-if="gameStarted">
        <div class="space-y-8 animate-[fadeIn_0.3s_ease-out]">
          
          <!-- Header Info -->
          <div class="flex items-center justify-between bg-white/5 rounded-2xl p-4 border border-white/10">
            <div class="font-semibold text-slate-200" x-text="'👤 ' + playerName"></div>
            <div class="font-mono font-bold text-lg" :class="balance > 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="'💰 $' + balance"></div>
          </div>

          <!-- Betting -->
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">💵 Bet Amount ($)</label>
            <input type="number" x-model.number="currentBet" class="w-full glow-input rounded-xl px-4 py-3 text-white font-mono text-lg text-center font-bold">
          </div>

          <!-- Numbers -->
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-3 text-center">🎲 Guess a Number (1-10)</label>
            <div class="grid grid-cols-5 gap-3">
              <template x-for="n in 10">
                <label class="num-btn cursor-pointer relative">
                  <input type="radio" :value="n" x-model.number="guess" class="sr-only">
                  <div class="w-full aspect-square rounded-xl flex items-center justify-center font-bold text-lg bg-white/5 border border-white/10 transition-colors hover:bg-white/10 text-white shadow-inner">
                    <span x-text="n"></span>
                  </div>
                </label>
              </template>
            </div>
          </div>

          <button @click="playRound" class="w-full neon-btn rounded-xl py-4 font-black tracking-widest text-white shadow-lg text-lg">
            🎯 SPIN & CLAIM
          </button>

          <!-- Result Message -->
          <div x-show="resultMessage" x-transition class="text-center p-4 rounded-xl font-medium border" :class="won ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/20 border-rose-500/30 text-rose-300'">
            <div class="text-xl mb-1" x-text="won ? '🎉 FANTASTIC! 🎉' : '😢 UNLUCKY 😢'"></div>
            <div x-text="resultMessage"></div>
          </div>

          <button @click="quitGame" class="w-full py-3 text-sm font-semibold text-slate-500 hover:text-white transition-colors">
            Exit to Desktop
          </button>

        </div>
      </template>

    </div>
  </div>

  <script>
    function casinoGame() {
      return {
        gameStarted: false,
        playerName: '',
        balance: 100,
        currentBet: 10,
        guess: 1,
        
        resultMessage: '',
        won: false,

        startGame() {
          if (!this.playerName.trim()) { alert("Please enter your name!"); return; }
          if (this.balance <= 0) { alert("Deposit must be greater than $0!"); return; }
          this.gameStarted = true;
          this.resultMessage = '';
        },

        playRound() {
          this.resultMessage = '';
          if (this.currentBet <= 0 || this.currentBet > this.balance) {
            alert(`Bet must be between $1 and $${this.balance}!`);
            return;
          }

          const luckyNumber = Math.floor(Math.random() * 10) + 1;
          
          if (this.guess === luckyNumber) {
            this.won = true;
            const winAmount = this.currentBet * 10;
            this.balance += winAmount;
            this.resultMessage = `You guessed ${this.guess} and won $${winAmount}! Lucky number was ${luckyNumber}.`;
          } else {
            this.won = false;
            this.balance -= this.currentBet;
            this.resultMessage = `You guessed ${this.guess} but it was ${luckyNumber}. You lost $${this.currentBet}.`;
          }

          if (this.balance <= 0) {
            setTimeout(() => {
              alert(`Balance reached $0!\n\nGood game, ${this.playerName}!`);
              this.gameStarted = false;
              this.playerName = '';
              this.balance = 100;
              this.resultMessage = '';
            }, 500);
          }
        },

        quitGame() {
          alert(`Thanks for playing, ${this.playerName}!\nFinal Balance: $${this.balance}`);
          window.close(); // attempts to close tab
        }
      }
    }
  </script>
</body>
</html>
