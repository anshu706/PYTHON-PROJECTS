<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Sudoku Solver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { background-color: #030305; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; }
    .glass { background: rgba(14, 14, 22, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .sdk-input { width: 34px; height: 34px; text-align: center; font-weight: bold; font-family: monospace; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; outline: none; border-radius: 4px; }
    .sdk-input:focus { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .thick-right { border-right: 2px solid rgba(255, 255, 255, 0.3) !important; }
    .thick-bottom { border-bottom: 2px solid rgba(255, 255, 255, 0.3) !important; }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen relative" x-data="sudokuApp()">
  <div class="relative z-10 glass rounded-3xl p-8 shadow-2xl space-y-6 text-center">
    <h1 class="text-2xl font-black uppercase tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
      🔲 Sudoku Solver & Player
    </h1>

    <div class="grid grid-cols-9 gap-1 justify-center max-w-fit mx-auto p-3 bg-black/40 rounded-2xl border border-white/10">
      <template x-for="(row, r) in board" :key="r">
        <template x-for="(cell, c) in row" :key="c">
          <input type="text" maxlength="1" 
                 :value="cell !== 0 ? cell : ''" 
                 @input="updateCell(r, c, $event.target.value)"
                 class="sdk-input"
                 :class="[(c === 2 || c === 5) ? 'thick-right' : '', (r === 2 || r === 5) ? 'thick-bottom' : '']" />
        </template>
      </template>
    </div>

    <div class="flex gap-3 justify-center">
      <button @click="solve" class="px-5 py-3 bg-gradient-to-r from-sky-400 to-indigo-400 text-slate-950 font-bold rounded-xl text-xs">
        ⚡ Auto-Solve Board
      </button>
      <button @click="resetBoard" class="px-5 py-3 bg-white/10 text-slate-300 font-bold rounded-xl text-xs hover:bg-white/20">
        Clear Board
      </button>
    </div>
  </div>

  <script>
    function sudokuApp() {
      return {
        board: [
          [5,3,0, 0,7,0, 0,0,0],
          [6,0,0, 1,9,5, 0,0,0],
          [0,9,8, 0,0,0, 0,6,0],
          [8,0,0, 0,6,0, 0,0,3],
          [4,0,0, 8,0,3, 0,0,1],
          [7,0,0, 0,2,0, 0,0,6],
          [0,6,0, 0,0,0, 2,8,0],
          [0,0,0, 4,1,9, 0,0,5],
          [0,0,0, 0,8,0, 0,7,9]
        ],
        updateCell(r, c, val) {
          const num = parseInt(val);
          this.board[r][c] = (!isNaN(num) && num >= 1 && num <= 9) ? num : 0;
        },
        resetBoard() {
          this.board = Array.from({length: 9}, () => Array(9).fill(0));
        },
        solve() {
          let b = JSON.parse(JSON.stringify(this.board));
          if (this.solveHelper(b)) {
            this.board = b;
          } else {
            alert("No solution exists for this board configuration!");
          }
        },
        solveHelper(b) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (b[r][c] === 0) {
                for (let num = 1; num <= 9; num++) {
                  if (this.isValid(b, r, c, num)) {
                    b[r][c] = num;
                    if (this.solveHelper(b)) return true;
                    b[r][c] = 0;
                  }
                }
                return false;
              }
            }
          }
          return true;
        },
        isValid(b, r, c, num) {
          for (let i = 0; i < 9; i++) {
            if (b[r][i] === num || b[i][c] === num) return false;
            let br = 3 * Math.floor(r / 3) + Math.floor(i / 3);
            let bc = 3 * Math.floor(c / 3) + i % 3;
            if (b[br][bc] === num) return false;
          }
          return true;
        }
      }
    }
  </script>
</body>
</html>
